<div class="form-grid{% if stack %} form-grid--stack{% endif %}">
  {% for field in form %}
    <div class="field{% if field.name != 'budget' and field.name != 'region' %} field--wide{% endif %}{% if field.errors %} field--error{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}
        <div class="field-hint">{{ field.help_text|safe }}</div>
      {% endif %}
      {% if field.errors %}
        <div class="field-error" role="alert">{{ field.errors }}</div>
      {% endif %}
    </div>
  {% endfor %}
</div>
